<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SliceGPT Orthogonal Rotation, SVD-LLM Whitening, and Basis Sharing" viewBox="-20 -20 1228 542" width="1228" height="542">
  <style>text { font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", "Segoe UI", system-ui, -apple-system, sans-serif; }</style>
  <rect x="-20" y="-20" width="1228" height="542" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <defs>
            <linearGradient id="s13-pca" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#3730A3"/>
