          <path d="M890,150 L910,150" stroke="#7C3AED" stroke-width="2.8" marker-end="url(#s16-arr)"/>

          <!-- Gen 4: Iterative Puzzle MoE -->
          <rect x="916" y="4" width="264" height="292" rx="14" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
          <rect x="930" y="16" width="236" height="30" rx="15" fill="#059669"/>
