          <rect x="18" y="58" width="246" height="176" rx="10" fill="#FFFFFF" stroke="#FDA4AF"/>
          <line x1="141" y1="70" x2="141" y2="206" stroke="#CBD5E1" stroke-dasharray="4,3"/>
