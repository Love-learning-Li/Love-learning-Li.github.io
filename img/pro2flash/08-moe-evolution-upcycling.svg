          <text x="1048" y="84" text-anchor="middle" fill="#065F46" font-size="14" font-weight="800">沙漏配额</text>
          <rect x="950" y="96" width="196" height="26" rx="6" fill="#059669"/>
          <text x="1048" y="114" text-anchor="middle" fill="#FFFFFF" font-size="13.5" font-weight="700">浅层 · 多</text>
          <rect x="984" y="130" width="128" height="26" rx="6" fill="#34D399"/>
          <text x="1048" y="148" text-anchor="middle" fill="#064E3B" font-size="13.5" font-weight="700">中层 · 少</text>
          <rect x="950" y="164" width="196" height="26" rx="6" fill="#059669"/>
          <text x="1048" y="182" text-anchor="middle" fill="#FFFFFF" font-size="13.5" font-weight="700">深层 · 多</text>
          <text x="1048" y="218" text-anchor="middle" fill="#065F46" font-size="13.5" font-weight="800">↻ 迭代 KL</text>

          <text x="1048" y="268" text-anchor="middle" fill="#047857" font-size="14" font-weight="800">异构小 MoE ✓</text>
  </g>
  <text x="8" y="374" fill="#334155" font-size="16" font-weight="800">B. 拓扑/专家粒度重构时的非蒸馏自底向上替代方案：Drop-Upcycling</text>
