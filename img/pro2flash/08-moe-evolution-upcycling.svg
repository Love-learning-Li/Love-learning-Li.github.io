          <rect x="626" y="152" width="246" height="82" rx="10" fill="#FFFFFF" stroke="#0891B2"/>
          <text x="749" y="180" text-anchor="middle" fill="#164E63" font-size="14.5" font-weight="800">D²-MoE · Delta SVD</text>
