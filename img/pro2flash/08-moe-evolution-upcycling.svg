              <path d="M0,1 L9,5 L0,9 z" fill="#7C3AED"/>
            </marker>
          
            <marker id="s16-arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
              <path d="M0,1 L9,5 L0,9 z" fill="#059669"/>
