          <text x="199" y="109" text-anchor="middle" fill="#065F46" font-size="14" font-weight="800">保留 ✓</text>

          <rect x="150" y="148" width="98" height="48" rx="7" fill="#FFFBEB" stroke="#D97706"/>
          <text x="199" y="177" text-anchor="middle" fill="#92400E" font-size="14" font-weight="800">损长尾</text>

          <text x="141" y="268" text-anchor="middle" fill="#881337" font-size="14" font-weight="800">Gate × ‖Act‖</text>

          <path d="M282,150 L302,150" stroke="#7C3AED" stroke-width="2.8" marker-end="url(#s16-arr)"/>

