  </defs>
  <rect x="-22" y="-22" width="1228" height="590" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="8" y="20" fill="#334155" font-size="16" font-weight="800">A. 大型 MoE → 小型 MoE 自顶向下四代压缩演进（REAP → REAM → Sub-MoE / D²-MoE → Iterative Puzzle）</text>
  <g transform="translate(-0, 30)">
    <!-- Gen 1: REAP -->
          <rect x="4" y="4" width="274" height="292" rx="14" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1.5"/>
          <rect x="18" y="16" width="246" height="30" rx="15" fill="#E11D48"/>
